[package]
name = "pitchlens-loadgen"
version = "0.1.0"
edition = "2021"
description = "Load generator for the PitchLens stream: N SSE viewers across M profiles"
license = "MIT"
publish = false

[[bin]]
name = "loadgen"
path = "src/main.rs"

[dependencies]
pitchlens-edge = { path = "..", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine/core
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Rust core (fmt, clippy, unit tests)
        working-directory: engine/core
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - run: python scripts/build_core.py
      - run: pytest
        env:
          PITCHLENS_CORE: rust
      - name: Schemas are in sync with generated web contract
        run: |
          python -m pitchlens.schema.export_jsonschema
          git diff --exit-code -- ../web/lib/schemas

  engine-python-only:
    # The engine without the Rust core: the pure-Python reference must keep working on its own.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest
        env:
          PITCHLENS_CORE: python

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated types are up to date
        run: |
          npm run gen:types
          git diff --exit-code -- lib/types.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  web-e2e:
    # Whole system in a real browser: engine + production web build + Chromium (Playwright).
    runs-on: ubuntu-latest
    needs: [engine, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - run: pip install -e "./engine"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web
        env:
          PITCHLENS_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: web/test-results
          retention-days: 7

  infra:
    # The Azure deployment templates compile and pass the Bicep linter (no Azure login needed).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: az bicep install
      - run: az bicep build --file infra/main.bicep --stdout > /dev/null
      - run: az bicep lint --file infra/main.bicep

  containers:
    # Both images build, and the engine container serves a match end to end.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f engine/Dockerfile -t pitchlens-engine .
      - run: docker build -t pitchlens-web --build-arg NEXT_PUBLIC_API_BASE=http://localhost:8000/api/v1 web
      - name: Engine container smoke test
        run: |
          docker run -d --name engine -p 8000:8080 pitchlens-engine
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/v1/health && break; sleep 1; done
          curl -sf http://localhost:8000/api/v1/health/ready
          curl -sf http://localhost:8000/api/v1/health | grep -q '"backend":"rust"'  # the Rust core loaded
          id=$(curl -sf -X POST http://localhost:8000/api/v1/matches -H 'content-type: application/json'             -d '{"seed":7,"storyline":"comeback","tracking":false}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["match_id"])')
          curl -sf -X POST "http://localhost:8000/api/v1/matches/$id/ask" -H 'content-type: application/json'             -d '{"question":"Who won?"}' | grep -q '2-3'
      - name: Web container serves the app
        run: |
          docker run -d --name web -p 3000:8080 pitchlens-web
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ > /dev/null && break; sleep 1; done
          curl -sf "http://localhost:3000/watch" > /dev/null

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.24.3"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Scan the full history with the CLI rather than the action's commit-range logic, which breaks
      # when a push contains a root commit (e.g. after a history rewrite). The repo is small.
      - name: Install gitleaks
        run: |
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan git history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pitchlens"
version = "0.1.0"
description = "Explainable, personalized match intelligence from synthetic football events."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "numpy>=2.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "opentelemetry-api>=1.27",
  "anthropic>=1.13",
  "openai>=1.40",
  "azure-identity>=1.17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]
azure = [
  "azure-eventhub>=5.12",
  "azure-cosmos>=4.7",
  "azure-monitor-opentelemetry>=1.6",
]

[project.scripts]
pitchlens-sim = "pitchlens.sim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pitchlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are evaluated once by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# Multilingual test strings deliberately contain non-ASCII digits and typographic spaces.
"tests/**" = ["RUF001"]

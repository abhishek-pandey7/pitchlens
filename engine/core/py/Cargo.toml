[package]
name = "pitchlens-py"
description = "Python bindings (PyO3) for the PitchLens kernel: the pitchlens_core module."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "pitchlens_core"
crate-type = ["cdylib"]

[dependencies]
pitchlens-kernel = { path = "../kernel", features = ["parallel"] }
# abi3: one wheel for every CPython >= 3.12. generate-import-lib: builds on Windows with the GNU
# toolchain, without the Visual Studio C++ tools.
pyo3 = { version = "0.25", features = ["abi3-py312", "generate-import-lib"] }
numpy = "0.25"

[features]
# Enabled by maturin for the Python module.
extension-module = ["pyo3/extension-module"]
